[versions]
compose-multiplatform = "1.12.0"
commonsCompress = "1.28.0"
injekt = "1.16.1"
jsoup = "1.23.2"
junrar = "8.0.0"
jna = "5.19.1"
junit = "6.1.3"
kotest-assertions = "6.2.5"
kotlin-gradle = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktlint = "1.8.0"
mockk = "1.14.11"
okhttp = "5.5.0"
okio = "3.18.2"
rxJava = "1.3.8"
spotless = "8.10.2"
sqldelight = "2.3.2"
twelveMonkeys = "3.13.1"
xz = "1.10"

[libraries]
commonsCompress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
injekt = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injekt" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest-assertions" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-gradle" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-jsonOkio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
ktlint-bom = { module = "com.pinterest.ktlint:ktlint-bom", version.ref = "ktlint" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-dnsOverHttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
rxJava = { module = "io.reactivex:rxjava", version.ref = "rxJava" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-jdbcDriver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-sqliteDialect338 = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
twelveMonkeys-bmp = { module = "com.twelvemonkeys.imageio:imageio-bmp", version.ref = "twelveMonkeys" }
twelveMonkeys-core = { module = "com.twelvemonkeys.imageio:imageio-core", version.ref = "twelveMonkeys" }
twelveMonkeys-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelveMonkeys" }
twelveMonkeys-metadata = { module = "com.twelvemonkeys.imageio:imageio-metadata", version.ref = "twelveMonkeys" }
twelveMonkeys-tiff = { module = "com.twelvemonkeys.imageio:imageio-tiff", version.ref = "twelveMonkeys" }
twelveMonkeys-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelveMonkeys" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-gradle" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-gradle" }
kotlin-samWithReceiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin-gradle" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-gradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

[bundles]
test = ["junit-jupiter", "kotest-assertions", "mockk"]
