name: Attach companion APK to release
# Manually writes the companion section of a release's notes from mobile-companion/RELEASE_NOTES.md,
# with the SHA-256 of the companion APKs already attached to that release. APKs are signed outside
# CI and are not kept in the repository; if some are placed in mobile-companion/dist/ (e.g. on a
# branch), they are uploaded first.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APKs to
        required: true
        default: v0.4.0
      update_notes:
        description: Write the companion section into the release notes
        type: boolean
        default: true
      from_tag:
        description: Copy the companion APKs already attached to this release (e.g. v0.4.0) instead of using mobile-companion/dist/
        required: false
        default: ''

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy APKs from another release
        if: inputs.from_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_TAG: ${{ inputs.from_tag }}
        run: |
          # The same signed files, byte for byte, so installs keep updating in place.
          mkdir -p mobile-companion/dist
          gh release download "$FROM_TAG" --pattern 'mihondesk-companion-*.apk' --dir mobile-companion/dist --clobber

      - name: Upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          apks=(mobile-companion/dist/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs in mobile-companion/dist/; keeping the release assets as they are."
            exit 0
          fi
          ls -l "${apks[@]}"
          gh release upload "$TAG" "${apks[@]}" --clobber

      - name: Update release notes
        if: inputs.update_notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          begin='<!-- companion-notes:begin -->'
          end='<!-- companion-notes:end -->'
          gh release view "$TAG" --json body --jq .body > body.md
          # Drop a previous companion section so re-runs replace it instead of appending twice.
          awk -v b="$begin" -v e="$end" '$0==b{skip=1} !skip{print} $0==e{skip=0}' body.md > rest.md
          {
            sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' rest.md
            printf '\n\n%s\n' "$begin"
            cat mobile-companion/RELEASE_NOTES.md
            printf '\n**SHA-256**\n\n```\n'
            gh release view "$TAG" --json assets \
              --jq '.assets[] | select(.name | test("^mihondesk-companion-.*\\.apk$")) | "\(.digest | ltrimstr("sha256:"))  \(.name)"'
            printf '```\n%s\n' "$end"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
